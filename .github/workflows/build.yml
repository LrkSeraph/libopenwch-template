# Build the skeleton, against two revisions of the library.
#
# `pinned` uses the submodule commit recorded here, which is the revision a
# person cloning this template gets; it is the check that the skeleton and the
# library it names still agree.  `master` builds the same skeleton against
# libopenwch's current master, which is how a library change that breaks
# applications shows up here instead of in someone's project.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  pinned:
    name: pinned submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A developer's absolute path in a committed file is a small leak that is
      # invisible in code review, and these repositories are public.  Cheap to
      # check here; expensive to discover later in the history.
      - name: No local paths or credentials in tracked files
        run: |
          fail=0
          if git grep -n -I -E '/home/[a-z]+/|/Users/[A-Za-z]+/|C:\\Users' -- . ; then
            echo "::error::a tracked file contains an absolute path from a developer's machine"
            fail=1
          fi
          if git grep -n -I -E 'PRIVATE KEY-----|password[[:space:]]*=|api[_-]?key[[:space:]]*=|ghp_[A-Za-z0-9]{20,}|github_pat_' -- . ; then
            echo "::error::a tracked file looks like it contains a credential"
            fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "no local paths or credentials in tracked files"

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Report the toolchain and the library revision
        run: |
          riscv64-unknown-elf-gcc --version | head -1
          git -C libopenwch rev-parse --short HEAD

      # First build: the library archives do not exist yet, so the Makefile
      # builds libopenwch on demand.  That path is the one a fresh clone takes,
      # so it is worth exercising rather than pre-building the library here.
      - name: Default device
        run: make

      - name: A part from each family
        run: |
          for dev in ch32v003f4p6 ch582m; do
            echo "== $dev"
            make clean
            make DEVICE="$dev" || exit 1
          done

      - name: A toolchain without newlib
        run: |
          make clean
          make LIBOPENWCH_NOSTDLIB=1

  master:
    name: current library master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Check out libopenwch master into a temporary directory
        run: |
          git clone --depth 1 \
            https://github.com/LrkSeraph/libopenwch.git "$RUNNER_TEMP/libopenwch"
          git -C "$RUNNER_TEMP/libopenwch" rev-parse --short HEAD

      - name: Build against it
        run: |
          for dev in ch32v003f4p6 ch582m; do
            echo "== $dev"
            make clean
            make OPENWCH_DIR="$RUNNER_TEMP/libopenwch" DEVICE="$dev" || exit 1
          done
